name: Repair navigation validation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate navigation sources
        run: |
          node --check public/master-enhancements.js
          node --check public/app.js
          node --check public/pwa.js
          node --check tests/final-regression.js
          git diff --check
          grep -q 'admin-nav.css?v=20261006-9' public/admin.html
          grep -q 'toggleAdminNav' public/admin.html
          grep -q 'toggle?.contains(e.target)' public/admin.html
          grep -q '@media(max-width:1180px)' public/admin-nav.css
