name: Android Release

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name"
        required: true
        default: "1.0"
      version_code:
        description: "Version code"
        required: true
        default: "1"


permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Regression tests
        run: npm test

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/pinoyambula-upload.jks
          chmod 600 android/pinoyambula-upload.jks

      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ inputs.version_name }}"
            VERSION_CODE="${{ inputs.version_code }}"
          else
            TAG="${GITHUB_REF_NAME#android-v}"
            VERSION_CODE="${TAG##*-}"
            VERSION_NAME="${TAG%-*}"
          fi

          case "$VERSION_CODE" in
            ''|*[!0-9]*)
              echo "Invalid version code: $VERSION_CODE"
              exit 1
              ;;
          esac

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

          echo "Version name: $VERSION_NAME"
          echo "Version code: $VERSION_CODE"

      - name: Build signed release APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/pinoyambula-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon clean assembleRelease bundleRelease \
            -PversionName="${{ steps.version.outputs.version_name }}" \
            -PversionCode="${{ steps.version.outputs.version_code }}"

      - name: Verify release APK
        run: |
          jarsigner -verify -verbose -certs \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Verify release AAB
        run: |
          jarsigner -verify -verbose -certs \
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pinoyambula-release-apk-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: pinoyambula-release-aab-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Create GitHub Release and upload APK/AAB
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "android/app/build/outputs/apk/release/app-release.apk" \
            "android/app/build/outputs/bundle/release/app-release.aab" \
            --title "PinoyAmbula Android ${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})" \
            --generate-notes

      - name: Cleanup signing key
        if: always()
        run: rm -f android/pinoyambula-upload.jks
