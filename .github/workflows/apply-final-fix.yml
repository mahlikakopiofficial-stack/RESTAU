name: Apply final runtime fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Apply final runtime fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply targeted fixes
        run: python scripts/apply-final-fix.py

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax and regression checks
        run: npm test && npm run check

      - name: Commit final fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-final-fix.yml scripts/apply-final-fix.py
          git add server.js lib/notifications.js tests/final-regression.js .github/workflows/apply-final-fix.yml scripts/apply-final-fix.py
          git commit -m "Apply final runtime fixes"
          git push origin main
