name: Admin Android Build

on:
  push:
    branches: [main]
    paths:
      - 'admin-android/**'
      - 'lib/admin-push.js'
      - 'server.js'
      - 'public/admin-push.js'
      - 'public/admin.html'
      - 'tests/final-regression.js'
      - 'package.json'
      - '.github/workflows/admin-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'admin-android/**'
      - 'lib/admin-push.js'
      - 'server.js'
      - 'public/admin-push.js'
      - 'public/admin.html'
      - 'tests/final-regression.js'
      - 'package.json'
      - '.github/workflows/admin-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-admin-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADMIN_FIREBASE_APP_ID: ${{ vars.ADMIN_FIREBASE_APP_ID }}
      ADMIN_FIREBASE_API_KEY: ${{ vars.ADMIN_FIREBASE_API_KEY }}
      ADMIN_FIREBASE_PROJECT_ID: ${{ vars.ADMIN_FIREBASE_PROJECT_ID }}
      ADMIN_FIREBASE_SENDER_ID: ${{ vars.ADMIN_FIREBASE_SENDER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Install backend test dependencies
        run: npm ci

      - name: Validate backend and inventory regressions
        run: npm run check && npm test

      - name: Report Firebase build configuration
        shell: bash
        run: |
          if [ -z "$ADMIN_FIREBASE_APP_ID" ] || [ -z "$ADMIN_FIREBASE_API_KEY" ] || [ -z "$ADMIN_FIREBASE_PROJECT_ID" ] || [ -z "$ADMIN_FIREBASE_SENDER_ID" ]; then
            echo "::warning::Firebase app variables are not set. This debug APK compiles, but FCM delivery will not initialize until the ADMIN_FIREBASE_* repository variables are configured."
          else
            echo "Firebase app variables are present."
          fi

      - name: Build admin debug APK
        run: gradle --no-daemon -p admin-android clean assembleDebug

      - name: Upload admin debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pinoyambula-admin-debug-apk
          path: admin-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
