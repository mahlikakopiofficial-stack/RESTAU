name: Admin Android Release

on:
  push:
    tags:
      - "admin-android-v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Admin app version name"
        required: true
        default: "1.0.0"
      version_code:
        description: "Admin app version code"
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  release-admin-app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ADMIN_FIREBASE_APP_ID: ${{ vars.ADMIN_FIREBASE_APP_ID }}
      ADMIN_FIREBASE_API_KEY: ${{ vars.ADMIN_FIREBASE_API_KEY }}
      ADMIN_FIREBASE_PROJECT_ID: ${{ vars.ADMIN_FIREBASE_PROJECT_ID }}
      ADMIN_FIREBASE_SENDER_ID: ${{ vars.ADMIN_FIREBASE_SENDER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require main source and complete Firebase settings
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Admin Android releases must be built from main."
              exit 1
            fi
          else
            git fetch origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Admin release tags must point to a commit already in main."
              exit 1
            fi
          fi

          for key in ADMIN_FIREBASE_APP_ID ADMIN_FIREBASE_API_KEY ADMIN_FIREBASE_PROJECT_ID ADMIN_FIREBASE_SENDER_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub Actions variable: $key"
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Install backend test dependencies
        run: npm ci

      - name: Run regression tests
        run: npm run check && npm test

      - name: Prepare separate admin signing key
        env:
          ADMIN_ANDROID_KEYSTORE_BASE64: ${{ secrets.ADMIN_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ADMIN_ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ADMIN_ANDROID_KEYSTORE_BASE64" | base64 --decode > admin-android/admin-upload.jks
          chmod 600 admin-android/admin-upload.jks

      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ inputs.version_name }}"
            VERSION_CODE="${{ inputs.version_code }}"
          else
            TAG="${GITHUB_REF_NAME#admin-android-v}"
            VERSION_CODE="${TAG##*-}"
            VERSION_NAME="${TAG%-*}"
          fi
          case "$VERSION_CODE" in
            ''|*[!0-9]*) echo "::error::Invalid version code"; exit 1 ;;
          esac
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build signed admin APK and AAB
        env:
          ADMIN_ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/admin-android/admin-upload.jks
          ADMIN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ADMIN_ANDROID_KEYSTORE_PASSWORD }}
          ADMIN_ANDROID_KEY_ALIAS: ${{ secrets.ADMIN_ANDROID_KEY_ALIAS }}
          ADMIN_ANDROID_KEY_PASSWORD: ${{ secrets.ADMIN_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ADMIN_ANDROID_KEYSTORE_PASSWORD"
          test -n "$ADMIN_ANDROID_KEY_ALIAS"
          test -n "$ADMIN_ANDROID_KEY_PASSWORD"
          gradle --no-daemon -p admin-android clean assembleRelease bundleRelease \
            -PversionName="${{ steps.version.outputs.version_name }}" \
            -PversionCode="${{ steps.version.outputs.version_code }}"

      - name: Verify signed outputs
        run: |
          jarsigner -verify -verbose -certs admin-android/app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -verbose -certs admin-android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload admin APK
        uses: actions/upload-artifact@v4
        with:
          name: pinoyambula-admin-apk-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: admin-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload admin AAB
        uses: actions/upload-artifact@v4
        with:
          name: pinoyambula-admin-aab-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: admin-android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Create admin GitHub Release for tag builds
        if: startsWith(github.ref, 'refs/tags/admin-android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "admin-android/app/build/outputs/apk/release/app-release.apk" \
            "admin-android/app/build/outputs/bundle/release/app-release.aab" \
            --title "PinoyAmbula Admin Android ${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})" \
            --generate-notes

      - name: Remove signing key
        if: always()
        run: rm -f admin-android/admin-upload.jks
