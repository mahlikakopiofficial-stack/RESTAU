plugins {
    id 'com.android.application'
}

def cfg = { String key ->
    String value = System.getenv(key) ?: ""
    value = value.replace("\\", "\\\\").replace('"', '\\"')
    return '"' + value + '"'
}

def hasSigning = System.getenv("ADMIN_ANDROID_KEYSTORE_FILE") &&
    System.getenv("ADMIN_ANDROID_KEYSTORE_PASSWORD") &&
    System.getenv("ADMIN_ANDROID_KEY_ALIAS") &&
    System.getenv("ADMIN_ANDROID_KEY_PASSWORD")

android {
    namespace "kw.pinoyambula.admin"
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "kw.pinoyambula.admin"
        minSdk 23
        targetSdk 36
        versionCode (project.findProperty("versionCode") ?: "1").toInteger()
        versionName (project.findProperty("versionName") ?: "1.0.0")
        buildConfigField "String", "FIREBASE_APP_ID", cfg("ADMIN_FIREBASE_APP_ID")
        buildConfigField "String", "FIREBASE_API_KEY", cfg("ADMIN_FIREBASE_API_KEY")
        buildConfigField "String", "FIREBASE_PROJECT_ID", cfg("ADMIN_FIREBASE_PROJECT_ID")
        buildConfigField "String", "FIREBASE_SENDER_ID", cfg("ADMIN_FIREBASE_SENDER_ID")
    }

    signingConfigs {
        release {
            if (hasSigning) {
                storeFile file(System.getenv("ADMIN_ANDROID_KEYSTORE_FILE"))
                storePassword System.getenv("ADMIN_ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ADMIN_ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ADMIN_ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.3.0')
    implementation 'com.google.firebase:firebase-messaging'
}
