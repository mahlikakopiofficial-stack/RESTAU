<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin UI Preview</title><link rel="stylesheet" href="store.css"><style>
body{background:#f5f7f5}
.admin{grid-template-columns:176px 1fr;min-height:100vh}
.side{padding:12px 10px;gap:3px}
.side .side-brand{display:flex;align-items:center;gap:8px;padding:8px 9px 13px;font:800 13px Inter,sans-serif;color:#fff}
.side .side-brand img{width:28px;height:28px}
.side a{display:flex;align-items:center;min-height:36px;padding:8px 9px;border-radius:8px;font:600 12px Inter,sans-serif}
.side a.active{background:#ffffff18}
.main{padding:20px 24px}
.admin-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.admin-top h1{margin:0}
.admin-actions{display:flex;gap:7px}
.admin-actions button{min-height:34px;padding:7px 10px;border:1px solid #dfe5e1;border-radius:8px;background:#fff;font:700 12px Inter;color:#405049}
@media(max-width:900px){.admin{grid-template-columns:1fr}.side{position:sticky;top:0;display:flex;align-items:center;gap:3px;overflow-x:auto;padding:7px 8px;z-index:20}.side .side-brand{flex:0 0 auto;padding:5px 8px}.side .side-brand img{width:25px;height:25px}.side a{flex:0 0 auto;min-height:34px;padding:7px 9px}.main{padding:16px}}
</style></head><body><div class="admin"><aside class="side"><div class="side-brand"><img src="../icons/pinoyambula.svg" alt="">PinoyAmbula</div><a href="index.html">← Storefront</a><a href="#" onclick="show('Dashboard');return false">Dashboard</a><a href="#" onclick="show('Orders');return false">Orders</a><a href="#" onclick="show('Menu');return false">Menu</a><a href="#" onclick="show('Customers');return false">Customers</a><a href="#" onclick="show('Settings');return false">Settings</a></aside><main class="main"><div class="brand"><img src="../icons/pinoyambula.svg">PinoyAmbula Admin</div><div id="adminContent"><h1 style="color:#173f35">Dashboard</h1><div class="statrow"><div class="stat panel"><span class="muted">Today</span><b>12</b><span class="muted">orders</span></div><div class="stat panel"><span class="muted">Revenue</span><b>48.500</b><span class="muted">KWD</span></div><div class="stat panel"><span class="muted">Customers</span><b>184</b></div><div class="stat panel"><span class="muted">Pending</span><b>3</b></div></div><section class="section"><div class="panel" style="padding:18px"><h2>Recent orders</h2><table><tr><th>#</th><th>Customer</th><th>Total</th><th>Status</th></tr><tr><td>#1042</td><td>Maria</td><td>4.300 KWD</td><td>Preparing</td></tr><tr><td>#1041</td><td>John</td><td>2.500 KWD</td><td>Delivered</td></tr></table></div></section></div></main></div><script>function show(t){const c=document.getElementById('adminContent');const data={Dashboard:['Dashboard','Stats, recent orders and quick actions.'],Orders:['Orders','Table, filtering, status changes, driver assignment and receipt tools.'],Menu:['Menu','Product cards, photos, prices, categories and availability controls.'],Customers:['Customers','Customer profiles, chat, loyalty and order history.'],Settings:['Settings','Restaurant details, website content, notifications and subscription controls.']};const x=data[t]||data.Dashboard;c.innerHTML='<h1 style="color:#173f35">'+x[0]+'</h1><div class="panel" style="padding:22px"><p class="sub">'+x[1]+'</p><button class="btn darkbtn">Preview action</button></div>'}</script></body></html>
