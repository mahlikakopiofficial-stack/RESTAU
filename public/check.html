<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌼%3C/text%3E%3C/svg%3E"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System Check — PinoyAmbula</title><link rel="stylesheet" href="style.css"></head><body>
<div class="banig"></div><div class="wrap" style="padding:24px 18px"><h2 style="color:var(--b)">🔧 System / Function Check</h2><p>Tests the API, forms, COD order, 26-day subscription, admin login and every link &amp; anchor on all pages. Test records are prefixed <b>__TEST__</b> (delete them in Admin).</p>
<p style="margin:12px 0"><input id="pw" type="password" placeholder="Admin password (optional, tests admin)" style="max-width:320px;display:inline-block"> <button class="btn" onclick="run()">▶ Run all checks</button> <a class="btn o" href="index.html">Home</a> <a class="btn o" href="admin.html">Admin</a></p>
<p id="sum" style="font-weight:700;margin-bottom:8px"></p><div class="tw"><table id="res"></table></div></div>
<script src="app.js"></script><script>
let ok=0,bad=0;const R=$('#res');
async function t(n,f){try{const d=await f();ok++;R.insertAdjacentHTML('beforeend',`<tr><td>✅</td><td>${esc(n)}</td><td>${esc(d||'')}</td></tr>`)}catch(e){bad++;R.insertAdjacentHTML('beforeend',`<tr><td>❌</td><td>${esc(n)}</td><td>${esc(e.message)}</td></tr>`)}$('#sum').textContent=`Passed ${ok} · Failed ${bad}`}
async function run(){R.innerHTML='';ok=bad=0;const id=Date.now()%1e7,ph='9'+id;let menu=[],AT;
await t('API health + database',async()=>{const h=await api('/health');return h.items+' menu items'});
await t('Config (currency, delivery fee)',async()=>{const c=await api('/config');CUR=c.currency;return c.currency+', fee '+c.fee});
await t('Menu: Regular, Budget, Drinks, Catering, Other Asian',async()=>{menu=await api('/menu');const c=['Regular','Budget','Drinks','Catering','Other Asian'].filter(x=>!menu.some(i=>i.cat==x));if(c.length)throw Error('missing '+c);return menu.length+' dishes'});
await t('Other Asian: ≥2 dishes per country',async()=>{const m={};menu.filter(i=>i.cat=='Other Asian').forEach(i=>m[i.region]=(m[i.region]||0)+1);const l=Object.entries(m);if(!l.length||l.some(x=>x[1]<2))throw Error(JSON.stringify(m));return l.map(x=>x.join(':')).join(', ')});
await t('26-day plans',async()=>(await api('/plans')).length+' plans');
await t('Gallery + testimonials',async()=>(await api('/gallery')).length+' photos, '+(await api('/testimonials')).length+' reviews');
await t('Newsletter signup',async()=>{await api('/newsletter','POST',{email:`__test__${id}@example.com`});return'saved'});
await t('Newsletter rejects bad email',async()=>{try{await api('/newsletter','POST',{email:'nope'})}catch(e){return'rejected'}throw Error('accepted bad email')});
await t('Inquiry form',async()=>{await api('/inquiry','POST',{name:'__TEST__',email:'t@example.com',msg:'check'});return'saved'});
await t('COD order with drop location + PACI',async()=>{const r=await api('/order','POST',{name:'__TEST__',phone:ph,address:'Test block 1, street 2',paci:'12345678',items:[{id:menu[0].id,qty:2}]});return'order #'+r.id+' total '+money(r.total)+' '+r.pay});
await t('Order rejects empty cart',async()=>{try{await api('/order','POST',{name:'a',phone:'1',address:'x',items:[]})}catch(e){return e.message}throw Error('accepted empty cart')});
await t('Plan-length subscription dates',async()=>{const s=new Date(Date.now()+3*864e5),st=s.toISOString().slice(0,10),en=new Date(s.getTime()+25*864e5).toISOString().slice(0,10);const r=await api('/subscribe','POST',{name:'__TEST__',email:`__test__${id}@example.com`,phone:ph,address:'Test',plan:'lunch26',start:st});if(r.end!==en)throw Error('end '+r.end+' expected '+en);return r.start+' → '+r.end});
await t('Past start date is rejected',async()=>{try{await api('/subscribe','POST',{name:'__TEST__',phone:ph,address:'x',plan:'lunch26',start:'2020-01-01'})}catch(e){return e.message}throw Error('accepted a past date')});
await t('Site settings (open/closed, fee, hero)',async()=>{const c=await api('/config');if(c.fee===undefined||!c.hero_title)throw Error('settings missing');return(c.accepting?'open':'closed')+', fee '+c.fee+', min '+c.min_order});
await t('Review goes to moderation (hidden until approved)',async()=>{const tag='__TEST__ review '+id;await api('/testimonials','POST',{name:'__TEST__',text:tag,stars:5});if((await api('/testimonials')).some(x=>x.text==tag))throw Error('unapproved review is public');return'pending approval'});
await t('Customer register → login → /me',async()=>{await api('/register','POST',{name:'__TEST__',phone:'8'+id,password:'secret1'});const l=await api('/login','POST',{phone:'8'+id,password:'secret1'});localStorage.setItem('ct_bak',tk('ct')||'');localStorage.setItem('ct',l.token);const m=await api('/me');const b=localStorage.getItem('ct_bak');b?localStorage.setItem('ct',b):localStorage.removeItem('ct');localStorage.removeItem('ct_bak');return m.name+', '+m.orders.length+' orders'});
await t('Admin endpoints locked without login',async()=>{try{await api('/admin/stats','GET',null,'none')}catch(e){return'401 ok'}throw Error('open!')});
if($('#pw').value){await t('Admin login',async()=>{AT=(await api('/admin/login','POST',{password:$('#pw').value})).token;return'token ok'});
if(AT)for(const x of['stats','list/orders','list/customers','list/subs','list/inquiries','list/newsletter','list/items','list/gallery','list/testimonials','settings','list/plans'])await t('Admin /'+x,async()=>{const r=await fetch('/api/admin/'+x,{headers:{Authorization:'Bearer '+AT}});if(!r.ok)throw Error('HTTP '+r.status);return'ok'})}
else R.insertAdjacentHTML('beforeend','<tr><td>➖</td><td>Admin tests</td><td>skipped — enter the admin password above</td></tr>');
await t('Uploads folder served',async()=>{const r=await fetch('/uploads/none.png');if(r.status!==404)throw Error('HTTP '+r.status);return'404 for missing file (route active)'});
for(const p of['index.html','account.html','admin.html','check.html']){const d=new DOMParser().parseFromString(await(await fetch('/'+p)).text(),'text/html');
for(const a of d.querySelectorAll('a[href]')){const h=a.getAttribute('href');await t('Link '+p+' → '+h,async()=>{if(h.startsWith('#')){if(h.length<2||!d.getElementById(h.slice(1)))throw Error('anchor target missing');return'anchor ok'}if(/^(https?:|mailto:|tel:)/.test(h))return'external (not tested)';const[u,hs]=h.split('#'),r=await fetch('/'+u);if(!r.ok)throw Error('HTTP '+r.status);if(hs&&!new DOMParser().parseFromString(await r.text(),'text/html').getElementById(hs))throw Error('#'+hs+' missing in '+u);return'HTTP '+r.status})}}
$('#sum').textContent+=bad?' — ⚠ fix the ❌ items':' — 🎉 all good'}
</script></body></html>
