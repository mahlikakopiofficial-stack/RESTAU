<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/icons/pinoyambula.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin — PinoyAmbula</title>
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="style.css?v=20261006-adminui1" />
    <link rel="stylesheet" href="/admin-nav.css?v=20261006-10" />
    <link rel="stylesheet" href="/admin-dashboard.css?v=20261006-6" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7b2d26" />
    <script src="/runtime-config.js"></script>
    <script src="/pwa.js?v=20261006-v27"></script>
  </head>
  <body>
    <div class="box" id="login">
      <h2>Admin Login</h2>
      <form onsubmit="lg(event)">
        <label>Password</label
        ><input name="password" type="password" required /><button class="btn">
          Login
        </button>
        <a class="btn o" href="index.html">Back to site</a>
      </form>
    </div>
    <div class="adm" id="app" hidden>
      <div id="side"></div>
      <div id="main"></div>
    </div>
    <script src="app.js?v=20261006-tz4"></script>
    <script>
      const K = "at",
        A = (u, m, b) => api("/admin" + u, m, b, K),
        TABS = [
          "Overview",
          "Orders",
          "Menu",
          "Gallery",
          "Regional Dishes",
          "Heritage",
          "Announcements",
          "Customers",
          "Subscriptions",
          "Reports",
          "Inquiries",
          "Newsletter",
          "Testimonials",
          "Plans",
          "Settings",
        ],
        CATS = ["Regular", "Budget", "Drinks", "Sweets", "Catering", "Other Asian"];
      let cur = "Overview";
      async function lg(e) {
        e.preventDefault();
        try {
          localStorage.setItem(
            K,
            (
              await api(
                "/admin/login",
                "POST",
                Object.fromEntries(new FormData(e.target)),
                K,
              )
            ).token,
          );
          show();
        } catch (x) {
          toast(x.message);
        }
      }
      function out() {
        localStorage.removeItem(K);
        location.reload();
      }
      function show() {
        const ok = !!tk(K);
        $("#login").hidden = ok;
        $("#app").hidden = !ok;
        if (ok) go(cur);
      }
      function renderAdminNav(t) {
        const side = $("#side");
        if (!side) return;
        const icons = {
          "Overview":"⌂",
          "Orders":"▤",
          "Menu":"◈",
          "Gallery":"▧",
          "Regional Dishes":"◉",
          "Heritage":"✦",
          "Announcements":"◌",
          "Customers":"♙",
          "Subscriptions":"↻",
          "Reports":"▥",
          "Inquiries":"✉",
          "Newsletter":"◎",
          "Testimonials":"★",
          "Plans":"◇",
          "Settings":"⚙"
        };
        side.innerHTML =
          '<div class="admin-brand" data-brand-logo><img src="/icons/pinoyambula.svg" alt="PinoyAmbula" width="42" height="42"><span class="admin-brand-copy"><b>PinoyAmbula</b><small>Restaurant Admin</small></span></div>' +
          '<button class="admin-nav-toggle" type="button" aria-label="Open admin navigation" aria-expanded="false" onclick="toggleAdminNav(this)"><span>☰</span><b>Menu</b></button>' +
          '<nav class="admin-nav-menu" id="adminNavMenu" aria-label="Admin navigation">' +
          '<div class="admin-nav-primary">' +
          TABS.map((x) => '<button type="button" class="' + (x == t ? "on" : "") + '"' + (x == t ? ' aria-current="page"' : '') + ' onclick="go(&quot;' + x.replace(/"/g, '&quot;') + '&quot;)"><span class="admin-nav-icon" aria-hidden="true">' + (icons[x] || "•") + '</span><span>' + x + '</span></button>').join("") +
          '</div>' +
          '<div class="admin-nav-footer">' +
          '<span class="admin-nav-separator" aria-hidden="true"></span>' +
          '<button type="button" onclick="location.href=&quot;/website&quot;"><span class="admin-nav-icon" aria-hidden="true">↗</span><span>Website</span></button>' +
          '<button type="button" class="admin-logout" onclick="out()"><span class="admin-nav-icon" aria-hidden="true">⇥</span><span>Logout</span></button>' +
          '</div>' +
          '</nav>';
        if(typeof applyUniversalBranding==="function")applyUniversalBranding();
      }
      async function go(t) {
        cur = t;
        renderAdminNav(t);
        if(typeof applyUniversalBranding==="function")applyUniversalBranding();
        try {
          CUR = (await api("/config")).currency;
          $("#main").innerHTML = `<h2>${t}</h2>` + (await R[t]());
          if (A_after) A_after();
          A_after = null;
        } catch (x) {
          if (/login/i.test(x.message)) {
            out();
          } else toast(x.message);
        }
      }
      window.toggleAdminNav=function(btn){
        const menu=document.getElementById("adminNavMenu");
        if(!menu)return;
        const open=!menu.classList.contains("open");
        menu.classList.toggle("open",open);
        btn?.setAttribute("aria-expanded",open?"true":"false");
        btn?.setAttribute("aria-label",open?"Close admin navigation":"Open admin navigation");
      };
      document.addEventListener("click",(e)=>{
        const menu=document.getElementById("adminNavMenu");
        const toggle=document.querySelector(".admin-nav-toggle");
        if(menu?.classList.contains("open")&&!menu.contains(e.target)&&!toggle?.contains(e.target)){
          menu.classList.remove("open");
          toggle?.setAttribute("aria-expanded","false");
          toggle?.setAttribute("aria-label","Open admin navigation");
        }
      });
      window.addEventListener("resize",()=>{
        const menu=document.getElementById("adminNavMenu");
        const toggle=document.querySelector(".admin-nav-toggle");
        if(!menu||!toggle)return;
        if(window.innerWidth>1180){
          menu.classList.remove("open");
          toggle.setAttribute("aria-expanded","false");
          toggle.setAttribute("aria-label","Open admin navigation");
        }
      });
      let A_after = null;
      function filterAdminMenu(){
        const q=String(document.getElementById("admin-menu-search")?.value||"").trim().toLowerCase();
        const cat=String(document.getElementById("admin-menu-category")?.value||"All");
        const cards=document.querySelectorAll("#admin-menu-list > .admin-menu-item");
        let shown=0;
        cards.forEach(card=>{
          const cardCat=String(card.querySelector("select")?.value||card.dataset.cat||"");
          const hay=[cardCat,...Array.from(card.querySelectorAll('input:not([type="checkbox"]):not([type="file"]),textarea')).map(el=>el.value)].join(" ").toLowerCase();
          const visible=(cat==="All"||cardCat===cat)&&(!q||hay.includes(q));
          card.hidden=!visible;
          if(visible)shown++;
        });
        const count=document.getElementById("admin-menu-count");
        if(count)count.textContent=shown+" "+(shown===1?"dish":"dishes")+" shown";
      }

      const tbl = (rows, cols) =>
        `<div class="tw"><table><tr>${cols.map((c) => `<th>${c[0]}</th>`).join("")}</tr>${rows.map((r) => `<tr>${cols.map((c) => `<td data-label="${c[0]}">${c[1](r)}</td>`).join("")}</tr>`).join("") || "<tr><td>No records yet</td></tr>"}</table></div>`;
      const del = (t, id) =>
        `<button class="btn s o" onclick="rm('${t}',${id})">Delete</button>`;
      async function rm(t, id) {
        if (confirm("Delete?")) {
          await A("/" + t + "/" + id, "DELETE");
          go(cur);
        }
      }
      const sel = (t, id, v, o) =>
        `<select onchange="A('/status/${t}/${id}','PUT',{status:this.value}).then(()=>toast('Updated'))">${o.map((x) => `<option${x == v ? " selected" : ""}>${x}</option>`).join("")}</select>`;
      const adminKuwaitToday=()=>typeof window.kuwaitToday==="function"?window.kuwaitToday():new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Kuwait",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
      const adminKuwaitDateTime=value=>typeof window.kuwaitDateTime==="function"?window.kuwaitDateTime(value):String(value??"");
      async function upl(f, qs) {
        if (!f) return;
        const fd = new FormData();
        fd.append("file", f);
        try {
          await A("/upload?" + qs, "POST", fd);
          toast("Image saved");
        } catch (e) {
          toast(e.message);
        }
      }
      async function clearImage(target,id){
        try{
          await A("/image","DELETE",{target,id});
          toast("Image removed");
          go(cur);
        }catch(e){toast(e.message)}
      }
      function pickItemImage(id, event) {
        event.stopPropagation();
        const input = document.createElement("input");
        input.type = "file";
        input.accept = "image/*";
        input.onchange = async () => {
          if (input.files[0]) {
            await upl(input.files[0], "target=item&id=" + id);
            go(cur);
          }
        };
        input.click();
      }
      function dz(el, qs, multi) {
        const run = async (fs) => {
          for (const f of multi ? fs : [fs[0]]) await upl(f, qs);
          go(cur);
        };
        el.ondragover = (e) => {
          e.preventDefault();
          el.classList.add("hot");
        };
        el.ondragleave = () => el.classList.remove("hot");
        el.ondrop = (e) => {
          e.preventDefault();
          el.classList.remove("hot");
          run([...e.dataTransfer.files]);
        };
        el.onclick = () => {
          const i = document.createElement("input");
          i.type = "file";
          i.accept = "image/*";
          i.multiple = !!multi;
          i.onchange = () => run([...i.files]);
          i.click();
        };
      }
      const R = {
        async Reports() {
          const today = adminKuwaitToday(),
            from = window._reportFrom || today,
            to = window._reportTo || today,
            r = await A(
              "/report-range?from=" +
                encodeURIComponent(from) +
                "&to=" +
                encodeURIComponent(to),
            );
          window._lastReport = r;
          return (
            '<div class="report-actions"><label>From <input id="reportFrom" type="date" value="' +
            from +
            '"></label><label>To <input id="reportTo" type="date" value="' +
            to +
            '"></label><button class="btn s" onclick="window._reportFrom=document.getElementById(\'reportFrom\').value;window._reportTo=document.getElementById(\'reportTo\').value;go(\'Reports\')">Refresh</button><button class="btn s o" onclick="printReport()">🖨 Print</button><button class="btn s o" onclick="exportReport()">⬇ CSV</button></div><div class="grid"><div class="card report-kpi">Sales<b>' +
            money(r.revenue) +
            '</b></div><div class="card report-kpi">Orders<b>' +
            r.orders +
            '</b></div><div class="card report-kpi">Delivered<b>' +
            r.delivered +
            '</b></div><div class="card report-kpi">Cancelled<b>' +
            r.cancelled +
            '</b></div><div class="card report-kpi">Paid revenue<b>' +
            money(r.paidRevenue) +
            '</b></div><div class="card report-kpi">Average order<b>' +
            money(r.averageOrder) +
            '</b></div><div class="card report-kpi">New subscriptions<b>' +
            r.newSubscriptions +
            '</b></div><div class="card report-kpi">Active subscriptions<b>' +
            r.activeSubscriptions +
            "</b></div></div><h3>Top menu items</h3>" +
            tbl(r.topItems, [
              ["Item", (x) => esc(x.name)],
              ["Qty sold", (x) => x.qty],
            ]) +
            "<h3>Orders</h3>" +
            tbl(r.ordersList, [
              ["#", (x) => x.id],
              ["Date", (x) => esc(adminKuwaitDateTime(x.created))],
              ["Customer", (x) => esc(x.name)],
              ["Status", (x) => esc(x.status)],
              ["Total", (x) => money(x.total)],
            ])
          );
        },
        async Overview() {
          const s = await A("/stats");
          return `<div class="grid">${[
            ["New orders", s.newOrders],
            ["All orders", s.orders],
            ["Revenue (excl. cancelled)", money(s.revenue)],
            ["Customers", s.customers],
            ["Active subscriptions", s.activeSubs],
            ["Inquiries", s.inquiries],
            ["Newsletter subscribers", s.subscribers],
          ]
            .map((x) => `<div class="card stat">${x[0]}<b>${x[1]}</b></div>`)
            .join("")}</div>`;
        },
        async Orders() {
          const o = await A("/list/orders"),
            f = window._of || "All",
            L = f == "All" ? o : o.filter((x) => x.status == f);
          window._ol = o;
          window._max = Math.max(0, ...o.map((x) => x.id));
          A_after = () => clearInterval(window._poll);
          return (
            `<p style="margin-bottom:10px"><select style="width:auto" onchange="window._of=this.value;go('Orders')">${["All", "Pending", "New", "Confirmed", "Preparing", "Out for delivery", "Delivered", "Cancelled", "Completed"].map((x) => `<option${x == f ? " selected" : ""}>${x}</option>`).join("")}</select> <button class="btn s o" onclick="exp('orders')">⬇ CSV</button> <small>New orders and customer messages alert while the admin portal is open.</small></p>` +
            tbl(L, [
              ["#", (r) => r.id],
              ["Date", (r) => esc(adminKuwaitDateTime(r.created))],
              ["Customer", (r) => `${esc(r.name)}<br>${esc(r.phone)}`],
              [
                "Drop location",
                (r) =>
                  `${esc(r.address)}${r.paci ? `<br><b>PACI:</b> ${esc(r.paci)}` : ""}${r.notes ? `<br><i>${esc(r.notes)}</i>` : ""}`,
              ],
              [
                "Items",
                (r) =>
                  JSON.parse(r.items)
                    .map((i) => i.qty + "× " + esc(i.name))
                    .join("<br>"),
              ],
              ["Payment", (r) => esc(r.pay || "COD")],
              ["Subtotal", (r) => money(r.subtotal || r.total)],
              ["Discount", (r) => money(r.discount || 0)],
              ["Total", (r) => money(r.total)],
              [
                "Status",
                (r) =>
                  sel("orders", r.id, r.status, [
                    "Pending",
                    "New",
                    "Confirmed",
                    "Preparing",
                    "Out for delivery",
                    "Delivered",
                    "Cancelled",
                    "Completed",
                  ]),
              ],
              [
                "",
                (r) =>
                  `<button class="btn s o" onclick="pr(${r.id})">🖨</button>`,
              ],
            ])
          );
        },
        async Menu() {
          const it = await A("/list/items");
          A_after = () => {
            $$(".idz").forEach((el) =>
              dz(el, "target=item&id=" + el.dataset.id),
            );
            filterAdminMenu();
          };
          return `<form class="card p mini" style="padding:14px;margin-bottom:16px" onsubmit="ai(event)"><b>Add dish</b><div class="f2"><input name="name" placeholder="Name" required><input name="price" type="number" step="0.001" placeholder="Price" required><select name="cat">${CATS.map((c) => `<option>${c}</option>`).join("")}</select><input name="region" placeholder="Country (Filipino / Japan / Korea…)"><input name="emoji" placeholder="Legacy icon (not used as default)"><input name="descr" placeholder="Description"><textarea name="ingredients" rows="2" placeholder="Full ingredients, comma-separated"></textarea></div><button class="btn s">Add</button></form>
<div class="admin-menu-tools"><label for="admin-menu-category">Category</label><select id="admin-menu-category" onchange="filterAdminMenu()"><option>All</option>${CATS.map((c)=>`<option>${c}</option>`).join("")}</select><label for="admin-menu-search">Search menu</label><input id="admin-menu-search" type="search" placeholder="Search name, category, region or ingredients" oninput="filterAdminMenu()" autocomplete="off"><span id="admin-menu-count" aria-live="polite"></span></div>
<p style="margin-bottom:10px">Manage each dish photo with its image controls.</p><div class="grid" id="admin-menu-list">${it
            .map(
              (i) => {
                const search=esc([i.name,i.cat,i.region,i.descr,i.ingredients||""].filter(Boolean).join(" "));
                return `<div class="card admin-menu-item" data-cat="${esc(i.cat)}" data-search="${search}"><div class="ph idz" data-id="${i.id}" style="position:relative;cursor:pointer;${i.img ? `background-image:url('${esc(i.img)}')` : ""}">${i.img ? "" : esc(i.emoji)}<span class="menu-photo-actions"><button type="button" title="Add or replace menu image" aria-label="Add or replace menu image" onclick="pickItemImage(${i.id},event)">▣</button><button type="button" title="Remove menu image" aria-label="Remove menu image" onclick="event.stopPropagation();clearImage('item',${i.id})" ${i.img ? "" : "disabled"}>×</button></span></div><div class="p mini"><input value="${esc(i.name)}" onchange="ui(${i.id},'name',this.value)"><input type="number" step="0.001" value="${i.price}" onchange="ui(${i.id},'price',+this.value)" placeholder="Regular price">
<input type="number" step="0.001" value="${i.discount_price || ""}" onchange="ui(${i.id},'discount_price',this.value)" placeholder="Discount price"><select onchange="ui(${i.id},'cat',this.value)">${CATS.map((c) => `<option${c == i.cat ? " selected" : ""}>${c}</option>`).join("")}</select><input value="${esc(i.region)}" onchange="ui(${i.id},'region',this.value)" placeholder="Country"><input value="${esc(i.descr)}" onchange="ui(${i.id},'descr',this.value)" placeholder="Description"><textarea rows="2" onchange="ui(${i.id},'ingredients',this.value)" placeholder="Full ingredients">${esc(i.ingredients || "")}</textarea><input value="${esc(i.emoji)}" onchange="ui(${i.id},'emoji',this.value)" style="width:80px"><label><input type="checkbox" ${i.active ? "checked" : ""} onchange="ui(${i.id},'active',this.checked?1:0)"> Available</label> ${del("items", i.id)}</div></div>`;
              },
            )
            .join("")}</div>`;
        },
        async Gallery() {
          const g = await A("/list/gallery");
          A_after = () => {
            dz($("#gdz"), "target=gallery", 1);
            $$(".gdz").forEach((el) =>
              dz(el, "target=gallery&id=" + el.dataset.id),
            );
          };
          return `<div class="drop" id="gdz">⬆ Add gallery photos</div><form class="card mini" style="padding:14px;margin:14px 0" onsubmit="addGalleryVideo(event)"><b>Add a video embed</b><input name="caption" maxlength="200" placeholder="Caption"><input name="url" type="url" placeholder="YouTube, TikTok, or Facebook video URL" required><button class="btn s">Add video</button></form><div class="grid">${g.map((x) => `<div class="card">${x.media_type === "video" && x.media_url ? `<iframe class="gallery-embed" src="${esc(x.media_url)}" title="${esc(x.caption || "Gallery video")}" loading="lazy" allow="encrypted-media; picture-in-picture; web-share" allowfullscreen></iframe>` : `<div class="ph gdz" data-id="${x.id}" style="height:160px;cursor:pointer;${x.img ? `background-image:url('${esc(x.img)}')` : ""}">${x.img ? "" : "🍽️"}</div>`}<div class="p" style="padding:8px"><input aria-label="Gallery caption" value="${esc(x.caption)}" onchange="up2('gallery','${x.id}','caption',this.value)">${del("gallery", x.id)}</div></div>`).join("")}</div>`;
        },
        async Customers() {
          const customers=await A("/list/customers");
          const inquiries=await A("/list/inquiries");
          window._customerChatData={customers,inquiries};
          const first=customers[0]?.id||"";
          A_after=()=>initCustomerChat();
          return (
            `<p>Customers sign in with their registered phone and password. Passwords cannot be viewed. Customer conversations are handled here so staff can reply without leaving the Customers section.</p>
            <button class="btn s o" onclick="exp('customers')">⬇ CSV</button>
            <div class="admin-chat-layout">
              <div class="admin-chat-list" id="admin-chat-customers">
                ${customers.length?customers.map(r=>`<button type="button" data-customer-chat="${r.id}" onclick="selectCustomerChat(${r.id})"><b>${esc(r.name)}</b><br><small>${esc(r.phone)} · ${esc((inquiries.filter(x=>x.customer_id==r.id)[0]?.status)||"No chat")}</small></button>`).join(""):"<p>No customers yet.</p>"}
              </div>
              <div class="admin-chat-panel">
                <div class="admin-chat-head" id="admin-chat-title">Select a customer</div>
                <div class="admin-chat-messages" id="admin-chat-messages"><p>Select a customer to view the conversation.</p></div>
                <form class="admin-chat-compose" id="admin-chat-form" onsubmit="sendCustomerChat(event)">
                  <textarea name="message" maxlength="4000" required placeholder="Write a reply to the customer..." disabled></textarea>
                  <button class="btn" disabled>Send</button>
                </form>
              </div>
            </div>
            ${tbl(customers, [
              ["#", (r) => r.id],
              ["Name", (r) => esc(r.name)],
              ["Phone", (r) => esc(r.phone)],
              ["Email", (r) => esc(r.email)],
              ["Orders", (r) => r.orders],
              ["Spent", (r) => money(r.spent)],
              ["Joined", (r) => esc(adminKuwaitDateTime(r.created))],
              ["Account access", (r) => `<button class="btn s o" onclick="issueReset(${r.id})">Send password-reset email</button>`],
              ["", (r) => del("customers", r.id)],
            ])}`
          );
        },
        async Subscriptions() {
          return (
            `<p class="small">Edit Start, End, Duration and WhatsApp opt-in directly. Start or Duration changes recalculate End; End changes recalculate Duration.</p><button class="btn s o" onclick="exp('subs')">⬇ CSV</button><br><br>` +
            tbl(await A("/list/subs"), [
              ["#", (r) => r.id],
              ["Customer", (r) => `${esc(r.name)}<br>${esc(r.phone)}`],
              [
                "Drop location",
                (r) =>
                  esc(r.address) +
                  (r.paci ? `<br><b>PACI:</b> ${esc(r.paci)}` : ""),
              ],
              ["Plan", (r) => esc(r.plan)],
              [
                "Start",
                (r) =>
                  `<input type="date" value="${esc(r.start)}" onchange="up2('subs',${r.id},'start',this.value)">`,
              ],
              [
                "End",
                (r) =>
                  `<input type="date" value="${esc(r.end)}" onchange="up2('subs',${r.id},'end',this.value)">`,
              ],
              [
                "Duration",
                (r) =>
                  `<input type="number" min="1" max="366" value="${r.duration_days || 26}" onchange="up2('subs',${r.id},'duration_days',+this.value)">`,
              ],
              [
                "WhatsApp",
                (r) =>
                  `<input type="checkbox" style="width:auto" ${r.whatsapp_opt_in ? "checked" : ""} onchange="up2('subs',${r.id},'whatsapp_opt_in',this.checked?1:0)">`,
              ],
              ["Price", (r) => money(r.price)],
              [
                "Status",
                (r) =>
                  sel("subs", r.id, r.status, [
                    "Active",
                    "Paused",
                    "Completed",
                    "Cancelled",
                  ]),
              ],
            ])
          );
        },
        async Inquiries() {
          return (
            `<button class="btn s o" onclick="exp('inquiries')">⬇ CSV</button><br><br>` +
            tbl(await A("/list/inquiries"), [
              ["Date", (r) => esc(adminKuwaitDateTime(r.created))],
              ["Name", (r) => esc(r.name)],
              ["Contact", (r) => esc(r.phone) + "<br>" + esc(r.email)],
              ["Topic", (r) => esc(r.type)],
              ["Message", (r) => esc(r.msg)],
              [
                "Status",
                (r) =>
                  sel("inquiries", r.id, r.status || "New", [
                    "New",
                    "Read",
                    "Replied",
                  ]),
              ],
              ["", (r) => del("inquiries", r.id)],
            ])
          );
        },
        async Newsletter() {
          const n = await A("/list/newsletter");
          window._em = n.map((x) => x.email).join(", ");
          return (

      async function selectCustomerChat(customerId){
        activeCustomerChatId=Number(customerId);
        $("#admin-chat-customers button").forEach(b=>b.classList.toggle("on",Number(b.dataset.customerChat)===activeCustomerChatId));
        const customer=(window._customerChatData?.customers||[]).find(x=>x.id==activeCustomerChatId);
        const list=customerInquiriesFor(activeCustomerChatId);
        activeCustomerInquiryId=list[0]?.id||null;
        $("#admin-chat-title").textContent=customer?customer.name+" · "+customer.phone:"Customer";
        const form=$("#admin-chat-form"), input=form?.elements.message, send=form?.querySelector("button");
        if(input)input.disabled=false;
        if(send)send.disabled=false;
        await refreshCustomerChat();
        if(activeCustomerChatTimer)clearInterval(activeCustomerChatTimer);
        activeCustomerChatTimer=setInterval(refreshCustomerChat,5000);

      async function refreshCustomerChat(){
        if(!activeCustomerChatId)return;
        try{
          if(!activeCustomerInquiryId){
            $("#admin-chat-messages").innerHTML='<p>No conversation yet. Send a message below to start one.</p>';
            return;
          }
          const rows=await A("/inquiries/"+activeCustomerInquiryId+"/messages");
          $("#admin-chat-messages").innerHTML=rows.map(m=>'<div class="admin-chat-bubble '+(m.author==="admin"?"admin":"customer")+'"><b>'+(m.author==="admin"?"You":"Customer")+'</b><div style="font-size:.72rem;opacity:.6">'+esc(adminKuwaitDateTime(m.created))+'</div>'+esc(m.message)+'</div>').join("");

      }
      async function sendCustomerChat(e){
        e.preventDefault();
        if(!activeCustomerChatId)return;
        const message=String(new FormData(e.target).get("message")||"").trim();
        if(!message)return;
        try{
          if(activeCustomerInquiryId){
            await A("/inquiries/"+activeCustomerInquiryId+"/messages","POST",{message});
          }else{
            const result=await A("/customers/"+activeCustomerChatId+"/messages","POST",{message});
            activeCustomerInquiryId=result.inquiryId;
          }
          e.target.reset();
          const data=window._customerChatData;
          if(data) data.inquiries=await A("/list/inquiries");
          await refreshCustomerChat();
        }catch(error){toast(error.message)}
