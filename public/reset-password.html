<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="/icons/pinoyambula.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/pinoyambula-192.png" />

    <title>Reset Password — PinoyAmbula</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7b2d26" />
    <script src="/runtime-config.js"></script>
    <script src="/pwa.js"></script>
  </head>
  <body>
    <div class="banig"></div>
    <nav>
      <div class="wrap">
        <a class="logo" href="index.html" aria-label="PinoyAmbula home"><img class="brand-mark" src="/icons/pinoyambula.svg" alt=""><span>PinoyAmbula</span></a>
      </div>
    </nav>
    <div class="wrap">
      <div class="box" style="max-width: 520px; margin: 50px auto">
        <h2>Set a new password</h2>
        <p id="msg">Choose a new password for your PinoyAmbula account.</p>
        <form id="form" onsubmit="resetPassword(event)">
          <label>New password</label
          ><input
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="6"
            required
          /><label>Confirm password</label
          ><input
            name="confirm"
            type="password"
            autocomplete="new-password"
            minlength="6"
            required
          /><button class="btn">Reset password</button>
        </form>
        <p><a href="account.html">Return to login</a></p>
      </div>
    </div>
    <script src="app.js"></script>
    <script>
      const token = new URLSearchParams(location.search).get("token");
      if (!token) {
        $("#form").hidden = true;
        $("#msg").textContent =
          "This password reset link is missing or invalid.";
      }
      async function resetPassword(e) {
        e.preventDefault();
        const f = e.target;
        const password = f.password.value;
        if (password !== f.confirm.value) {
          toast("Passwords do not match");
          return;
        }
        try {
          const r = await api("/password-reset/confirm", "POST", {
            token,
            password,
          });
          f.hidden = true;
          $("#msg").textContent = r.message;
        } catch (x) {
          toast(x.message);
        }
      }
    </script>
  </body>
</html>
